<div class="kpi-card">
    <div class="kpi-icon">
        <i class="{{ reporte.icono_fa }}"></i>
    </div>
    <h3 class="kpi-title">{{ reporte.nombre_visible }}</h3>
    <p class="kpi-description">
        {{ reporte.descripcion }}
    </p>

    <form id="form-indicadores-gerencia">
        <div class="mb-3">
            <select name="agencia" id="agencia-indicadores" class="form-select">
                <option value="0">Agencia Consolidado</option>
                <option value="103">Acacias</option>
                <option value="109">Barranca De Upia</option>
                <option value="111">Cabuyaro</option>
                <option value="216">Castilla La Nueva</option>
                <option value="108">Catama</option>
                <option value="203">Cubarral</option>
                <option value="206">Cumaral</option>
                <option value="213">El Castillo</option>
                <option value="106">Granada</option>
                <option value="107">Guayabetal</option>
                <option value="205">Lejanias</option>
                <option value="211">Mesetas</option>
                <option value="105">Montecarlo</option>
                <option value="102">Popular</option>
                <option value="104">Porfia</option>
                <option value="101">Principal</option>
                <option value="110">Puerto Gaitan</option>
                <option value="214">Puerto Lleras</option>
                <option value="210">Puerto Lopez</option>
                <option value="204">Puerto Rico</option>
                <option value="208">Tauramena</option>
                <option value="212">Uribe</option>
                <option value="207">Villanueva</option>
                <option value="112">Vista Hermosa</option>
                <option value="209">Yopal</option>
            </select>
        </div>
    </form>

    <div id="indicadores-gerencia-table-container">
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Item</th>
                    <th>Cantidad Acumulado</th>
                    <th>Cantidad a Hoy</th>
                    <th>Monto Acumulado</th>
                    <th>Monto a Hoy</th>
                    <th>Meta Mensual</th>
                </tr>
            </thead>
            <tbody id="indicadores-gerencia-tbody">
                <!-- Data will be loaded here by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const agenciaSelect = document.getElementById('agencia-indicadores');
    const tbody = document.getElementById('indicadores-gerencia-tbody');

    function fetchData(agenciaId) {
        fetch(`/gria/gerencia/api/indicadores/${agenciaId}/`)
            .then(response => response.json())
            .then(data => {
                tbody.innerHTML = ''; // Clear existing data
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay datos disponibles.</td></tr>';
                } else {
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.ITEM}</td>
                            <td>${row.CANTIDADACUMULADA}</td>
                            <td>${row.CANTIDAD}</td>
                            <td>${row.MONTOACUMULADO}</td>
                            <td>${row.MONTO}</td>
                            <td>${row.METAMENSUAL}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Error al cargar los datos.</td></tr>';
            });
    }

    // Fetch initial data
    fetchData(agenciaSelect.value);

    // Fetch data on select change
    agenciaSelect.addEventListener('change', function() {
        fetchData(this.value);
    });
});
</script>
