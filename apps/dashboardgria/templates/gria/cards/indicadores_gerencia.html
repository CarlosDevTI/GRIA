<div class="kpi-card-gerencia">
    <div class="kpi-card-content-gerencia">
        <div class="kpi-icon">
            <i class="{{ reporte.icono_fa }}"></i>
        </div>
        <h3 class="kpi-title">{{ reporte.nombre_visible }}</h3>

        <div class="mb-3">
            <label for="agencia-indicadores" class="form-label">Seleccionar Agencia:</label>
            <select id="agencia-indicadores-select" class="form-select">
                <option value="0" selected>Agencia Consolidado</option>
                <option value="103">Acacias</option>
                <option value="109">Barranca De Upia</option>
                <option value="111">Cabuyaro</option>
                <option value="216">Castilla La Nueva</option>
                <option value="108">Catama</option>
                <option value="203">Cubarral</option>
                <option value="206">Cumaral</option>
                <option value="213">El Castillo</option>
                <option value="106">Granada</option>
                <option value="107">Guayabetal</option>
                <option value="205">Lejanias</option>
                <option value="211">Mesetas</option>
                <option value="105">Montecarlo</option>
                <option value="102">Popular</option>
                <option value="104">Porfia</option>
                <option value="101">Principal</option>
                <option value="110">Puerto Gaitan</option>
                <option value="214">Puerto Lleras</option>
                <option value="210">Puerto Lopez</option>
                <option value="204">Puerto Rico</option>
                <option value="208">Tauramena</option>
                <option value="212">Uribe</option>
                <option value="207">Villanueva</option>
                <option value="112">Vista Hermosa</option>
                <option value="209">Yopal</option>
            </select>
        </div>

        <div id="indicadores-gerencia-table-container">
            <!-- El contenido se cargará aquí vía JS -->
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('indicadores-gerencia-table-container');
    const select = document.getElementById('agencia-indicadores-select');

    function loadIndicadores(agenciaId) {
        // 1. Mostrar spinner de carga
        container.innerHTML = `
            <div class="d-flex justify-content-center align-items-center" style="min-height: 200px;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <strong class="ms-3">Cargando datos...</strong>
            </div>
        `;

        // 2. Construir la URL y hacer la petición fetch
        const url = `{% url 'api_get_indicadores_gerencia' %}?agencia_id=${agenciaId}`;
        
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                // 3. Inyectar el HTML de la tabla en el contenedor
                container.innerHTML = html;
            })
            .catch(error => {
                // 4. Mostrar un mensaje de error si algo falla
                console.error('Error al cargar los indicadores:', error);
                container.innerHTML = `
                    <div class="alert alert-danger text-center">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Error al cargar los datos. Por favor, intente de nuevo más tarde.
                    </div>
                `;
            });
    }

    // Carga inicial de datos al cargar la página
    loadIndicadores(select.value);

    // Event listener para cuando cambia la selección de la agencia
    select.addEventListener('change', function() {
        loadIndicadores(this.value);
    });
});
</script>
